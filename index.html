/*
==================================================
문자 정리
==================================================
*/

function normalizeText(text) {

  return removeHtmlTags(
    text || ""
  )
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();

}


/*
==================================================
단어 포함 검사
==================================================
*/

function containsTerm(
  text,
  term
) {

  return text.includes(
    term.toLowerCase()
  );

}


function countMatches(
  text,
  terms
) {

  let count = 0;

  terms.forEach(
    function(term) {

      if (
        containsTerm(
          text,
          term
        )
      ) {
        count++;
      }

    }
  );

  return count;

}


/*
==================================================
투자 관련도 계산
==================================================
*/

function calculateRelevance(
  item
) {

  const profile =
    STOCK_PROFILES[
      item.stock
    ];


  /*
  아직 별도 프로필이 없는 종목은
  일반적인 투자 키워드만 사용한다.
  */

  const title =
    normalizeText(
      item.title
    );

  const description =
    normalizeText(
      item.description
    );

  const fullText =
    title + " " + description;


  let score = 0;


  /*
  회사 이름이 제목에 있으면 기본 가점
  */

  const stockName =
    normalizeText(
      item.stock
    );


  if (
    stockName &&
    title.includes(stockName)
  ) {
    score += 15;
  }


  /*
  사용자가 직접 등록한 키워드와
  매칭된 뉴스도 약간 가점
  */

  if (
    item.matchedKeyword
  ) {
    score += 8;
  }


  /*
  일반적인 투자 중요 단어
  */

  score +=
    countMatches(
      title,
      GLOBAL_HIGH_VALUE_TERMS
    ) * 6;


  score +=
    countMatches(
      description,
      GLOBAL_HIGH_VALUE_TERMS
    ) * 3;


  /*
  종목별 프로필이 없으면 여기까지
  */

  if (!profile) {

    item.relevanceScore =
      score;

    return score;

  }


  /*
  종목 핵심 키워드

  제목에 있으면 강한 가점
  설명에만 있으면 조금 낮은 가점
  */

  score +=
    countMatches(
      title,
      profile.strong
    ) * 14;


  score +=
    countMatches(
      description,
      profile.strong
    ) * 7;


  /*
  실적/계약/기업가치 관련
  */

  score +=
    countMatches(
      title,
      profile.financial
    ) * 11;


  score +=
    countMatches(
      description,
      profile.financial
    ) * 5;


  /*
  보조 사업

  그 자체만으로는 높은 점수를 주지 않는다.
  */

  score +=
    countMatches(
      title,
      profile.secondaryBusiness
    ) * 3;


  score +=
    countMatches(
      description,
      profile.secondaryBusiness
    ) * 1;


  /*
  낮은 가치 표현 감점
  */

  score -=
    countMatches(
      title,
      profile.lowValue
    ) * 16;


  score -=
    countMatches(
      description,
      profile.lowValue
    ) * 7;


  /*
  ================================================
  삼성전자 문맥 규칙
  ================================================
  */

  if (
    item.stock ===
    "삼성전자"
  ) {

    const hasGalaxy =
      countMatches(
        fullText,
        profile.secondaryBusiness
      ) > 0;


    const hasFinancial =
      countMatches(
        fullText,
        profile.financial
      ) > 0;


    const hasSalesContext =
      [
        "판매량",
        "판매 증가",
        "판매 감소",
        "출하량",
        "점유율",
        "시장점유율",
        "판매 부진",
        "판매 호조",
        "shipments",
        "market share",
        "sales growth",
        "sales decline"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    const hasPromotion =
      [
        "경품",
        "사은품",
        "이벤트",
        "할인",
        "프로모션",
        "체험 행사",
        "체험행사"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    /*
    갤럭시 판매량/실적 뉴스는
    의미 있는 뉴스일 수 있다.
    */

    if (
      hasGalaxy &&
      (
        hasFinancial ||
        hasSalesContext
      )
    ) {

      score += 18;

    }


    /*
    갤럭시 + 경품/행사라면 강한 감점
    */

    if (
      hasGalaxy &&
      hasPromotion &&
      !hasFinancial &&
      !hasSalesContext
    ) {

      score -= 30;

    }

  }


  /*
  ================================================
  Curiox 문맥 규칙
  ================================================
  */

  if (
    item.stock ===
    "Curiox"
  ) {

    /*
    AZ는 두 글자라서
    단순 문자열 "az"만으로 점수를 주지 않는다.

    AstraZeneca / 아스트라제네카가
    실제로 등장할 때만 강한 가점.
    */

    const hasAstraZeneca =
      fullText.includes(
        "astrazeneca"
      ) ||
      fullText.includes(
        "아스트라제네카"
      );


    if (hasAstraZeneca) {
      score += 22;
    }


    const hasNIST =
      fullText.includes(
        "nist"
      ) ||
      fullText.includes(
        "national institute of standards and technology"
      );


    if (hasNIST) {
      score += 24;
    }


    const hasFDA =
      fullText.includes(
        "fda"
      ) ||
      fullText.includes(
        "food and drug administration"
      );


    if (hasFDA) {
      score += 22;
    }


    const hasContract =
      [
        "contract",
        "agreement",
        "계약",
        "수주",
        "공급계약",
        "공급 계약"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    const hasRevenue =
      [
        "revenue",
        "sales",
        "매출",
        "실적"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    const hasPartnership =
      [
        "partnership",
        "파트너십",
        "파트너쉽"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    const hasStandardization =
      [
        "standardization",
        "standardisation",
        "표준화"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    const hasWhitePaper =
      [
        "white paper",
        "whitepaper",
        "백서"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    const hasBigPharma =
      [
        "big pharma",
        "bigpharma",
        "빅파마"
      ].some(
        function(term) {
          return fullText.includes(
            term
          );
        }
      );


    /*
    큐리옥스에서 특히 중요하게 보는
    이벤트에 추가 가점
    */

    if (hasContract) {
      score += 18;
    }

    if (hasRevenue) {
      score += 18;
    }

    if (hasPartnership) {
      score += 17;
    }

    if (hasStandardization) {
      score += 18;
    }

    if (hasWhitePaper) {
      score += 15;
    }

    if (hasBigPharma) {
      score += 18;
    }


    /*
    조합 가점

    예:
    NIST + 표준화
    FDA + 표준화
    빅파마 + 계약
    AstraZeneca + partnership

    이런 조합은 단순 단어 등장보다
    훨씬 투자 관련성이 높다고 본다.
    */

    if (
      hasNIST &&
      hasStandardization
    ) {
      score += 25;
    }


    if (
      hasFDA &&
      hasStandardization
    ) {
      score += 22;
    }


    if (
      hasBigPharma &&
      (
        hasContract ||
        hasPartnership
      )
    ) {
      score += 25;
    }


    if (
      hasAstraZeneca &&
      (
        hasContract ||
        hasPartnership
      )
    ) {
      score += 28;
    }


    if (
      hasRevenue &&
      hasContract
    ) {
      score += 20;
    }

  }


  /*
  점수 저장
  */

  item.relevanceScore =
    score;


  return score;

}


/*
==================================================
뉴스 정렬

1순위: 투자 관련도
2순위: 같은 관련도면 최신 뉴스
==================================================
*/

function sortByRelevance(
  a,
  b
) {

  const scoreA =
    calculateRelevance(a);

  const scoreB =
    calculateRelevance(b);


  if (
    scoreA !== scoreB
  ) {

    return scoreB - scoreA;

  }


  return (
    new Date(
      b.pubDate
    ).getTime() || 0
  ) -
  (
    new Date(
      a.pubDate
    ).getTime() || 0
  );

}

function saveAIAnalysisCache() {

  const keys =
    Object.keys(
      aiAnalysisCache
    );


  if (
    keys.length > 200
  ) {

    const keysToDelete =
      keys.slice(
        0,
        keys.length - 200
      );


    keysToDelete.forEach(
      function(key) {

        delete aiAnalysisCache[
          key
        ];

      }
    );

  }


  localStorage.setItem(
    "aiAnalysisCache",
    JSON.stringify(
      aiAnalysisCache
    )
  );

}

/*
==================================================
뉴스 API
==================================================
*/

async function fetchQuery(
  query,
  stockName,
  matchedKeyword
) {

  const response =
    await fetch(
      "/api/news?q=" +
      encodeURIComponent(
        query
      )
    );


  if (!response.ok) {

    throw new Error(
      "뉴스 호출 실패"
    );

  }


  const data =
    await response.json();


  return (
    data.items || []
  ).map(
    function(item) {

      return {
        ...item,
        stock:
          stockName,
        matchedKeyword:
          matchedKeyword
      };

    }
  );

}


async function fetchStockNews(
  stockName
) {

  /*
  NewsData 무료 할당량 보호를 위해
  사용자 키워드는 최대 2개만 실제 검색
  */

  const keywords =
    (
      stockKeywords[
        stockName
      ] || []
    ).slice(0, 2);


  const requests = [

    fetchQuery(
      stockName,
      stockName,
      null
    )

  ];


  keywords.forEach(
    function(keyword) {

      requests.push(

        fetchQuery(
          keyword,
          stockName,
          keyword
        )

      );

    }
  );


  const results =
    await Promise.all(
      requests
    );


  return removeDuplicates(
    results.flat()
  );

}


/*
==================================================

*/

async function loadAllNews() {

  selectedStock =
    "ALL";

  renderStocks();


  newsHeading.textContent =
    "내 종목 투자 뉴스";


  newsList.innerHTML =
    '<div class="message">투자 관련도를 계산하며 뉴스를 모으는 중...</div>';


  if (
    stocks.length === 0
  ) {

    currentNews = [];

    newsList.innerHTML =
      '<div class="message">등록된 종목이 없습니다.</div>';

    return;

  }


  try {

    const results =
      await Promise.all(

        stocks.map(
          function(stock) {

            return fetchStockNews(
              stock
            );

          }
        )

      );


    currentNews =
      removeDuplicates(
        results.flat()
      );


    currentNews.sort(
      sortByRelevance
    );


    renderCurrentNews();


  } catch (error) {

    console.error(error);

    newsList.innerHTML =
      '<div class="message">뉴스를 불러오는 중 오류가 발생했습니다.</div>';

  }

}

/*
==================================================
현재 필터 적용
==================================================
*/

function renderCurrentNews() {

  let items =
    currentNews.slice();


  if (
    currentFilter ===
    "NEW"
  ) {

    items =
      items.filter(
        function(item) {

          return !isArticleSeen(
            getArticleKey(item)
          );

        }
      );

  }


  if (
    currentFilter ===
    "ANALYZED"
  ) {

    items =
      items.filter(
        function(item) {

          return Boolean(
            aiAnalysisCache[
              getArticleKey(item)
            ]
          );

        }
      );

  }


  /*
  중요 뉴스는
  AI 분석이 완료된 기사 중
  중요도 4~5인 기사.

  분석하지 않은 기사를
  중요하지 않다고 오판해 숨기지 않는다.
  */

  if (
    currentFilter ===
    "IMPORTANT"
  ) {

    items =
      items.filter(
        function(item) {

          const analysis =
            aiAnalysisCache[
              getArticleKey(item)
            ];


          return (
            analysis &&
            Number(
              analysis.importance
            ) >= 4
          );

        }
      );

  }


  renderNews(items);

}


/*
==================================================
기사 고유값
==================================================
*/

function getArticleKey(
  item
) {

  if (item.link) {
    return item.link;
  }


  return (
    "title:" +
    removeHtmlTags(
      item.title
    )
      .toLowerCase()
      .trim()
  );

}


/*
==================================================
NEW
==================================================
*/

function isArticleSeen(
  key
) {

  return seenArticles.includes(
    key
  );

}


function markArticleAsSeen(
  key
) {

  if (
    !seenArticles.includes(
      key
    )
  ) {

    seenArticles.push(
      key
    );

    saveSeenArticles();

  }

}


/*
==================================================
중복 제거
==================================================
*/

function removeDuplicates(
  items
) {

  const seen =
    new Set();


  return items.filter(
    function(item) {

      const key =
        getArticleKey(
          item
        );


      if (
        seen.has(key)
      ) {
        return false;
      }


      seen.add(key);

      return true;

    }
  );

}

==================================================
AI 요청
==================================================
*/

async function requestAIAnalysis(
  item
) {

  const response =
    await fetch(
      "/api/analyze",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            stock:
              item.stock,

            title:
              removeHtmlTags(
                item.title
              ),

            description:
              removeHtmlTags(
                item.description
              )

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error ||
      "AI 분석 실패"
    );

  }


  if (!data.analysis) {

    throw new Error(
      "AI 분석 결과 없음"
    );

  }


  return data.analysis;

}

  };

/*
==================================================
별
==================================================
*/

function getStars(
  importance
) {

  let number =
    Number(
      importance
    );


  if (
    !Number.isInteger(number) ||
    number < 1 ||
    number > 5
  ) {

    number = 1;

  }


  return (
    "★".repeat(number) +
    "☆".repeat(
      5 - number
    )
  );

}

/*
==================================================
뉴스 표시
==================================================
*/

function renderNews(
  items
) {

  newsList.innerHTML = "";


  if (
    items.length === 0
  ) {

    let message =
      "조건에 맞는 뉴스가 없습니다.";


    if (
      currentFilter ===
      "IMPORTANT"
    ) {

      message =
        "아직 AI가 중요하다고 분석한 뉴스가 없습니다. 👻 분석 후 중요도 ★★★★☆ 이상이면 여기에 표시됩니다.";

    }


    newsList.innerHTML =
      '<div class="message">' +
      message +
      '</div>';

    return;

  }


  items.forEach(
    function(item) {

      const articleKey =
        getArticleKey(
          item
        );


      const cachedAnalysis =
        aiAnalysisCache[
          articleKey
        ];


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "news-card";


      const isNew =
        !isArticleSeen(
          articleKey
        );


      if (isNew) {

        card.classList.add(
          "is-new"
        );

      }


      /*
      상단 배지
      */

      const top =
        document.createElement(
          "div"
        );

      top.className =
        "news-top";


      let newBadge = null;


      if (isNew) {

        newBadge =
          document.createElement(
            "span"
          );

        newBadge.className =
          "new-badge";

        newBadge.textContent =
          "NEW";

        top.appendChild(
          newBadge
        );

      }


      const stockBadge =
        document.createElement(
          "span"
        );

      stockBadge.className =
        "stock-badge";

      stockBadge.textContent =
        item.stock;

      top.appendChild(
        stockBadge
      );


      const sourceBadge =
        document.createElement(
          "span"
        );


      if (
        item.source ===
        "GLOBAL"
      ) {

        sourceBadge.className =
          "source-badge global";

        sourceBadge.textContent =
          item.sourceName
            ? "GLOBAL · " +
              item.sourceName
            : "GLOBAL";

      } else {

        sourceBadge.className =
          "source-badge";

        sourceBadge.textContent =
          "NAVER";

      }


      top.appendChild(
        sourceBadge
      );


      if (
        item.matchedKeyword
      ) {

        const keywordBadge =
          document.createElement(
            "span"
          );

        keywordBadge.className =
          "keyword-badge";

        keywordBadge.textContent =
          item.matchedKeyword;

        top.appendChild(
          keywordBadge
        );

      }


      /*
      이미 AI 분석된 뉴스라면
      목록에서 바로 신호등 + 별
      */

      if (cachedAnalysis) {

        const analysisBadge =
          document.createElement(
            "span"
          );

        analysisBadge.className =
          "analysis-badge";


        const display =
          getImpactDisplay(
            cachedAnalysis.impact
          );


        analysisBadge.textContent =
          display.icon +
          " " +
          getStars(
            cachedAnalysis.importance
          );


        top.appendChild(
          analysisBadge
        );

      }


      /*
      제목
      */

      const titleBox =
        document.createElement(
          "div"
        );

      titleBox.className =
        "news-title";


      const link =
        document.createElement(
          "a"
        );

      link.textContent =
        removeHtmlTags(
          item.title
        );

      link.href =
        safeUrl(
          item.link
        );

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";


      link.addEventListener(
        "click",
        function() {

          markArticleAsSeen(
            articleKey
          );


          if (newBadge) {

            newBadge.remove();

          }


          card.classList.remove(
            "is-new"
          );

        }
      );


      titleBox.appendChild(
        link
      );


      /*
      설명
      */

      const description =
        document.createElement(
          "div"
        );

      description.className =
        "news-description";

      description.textContent =
        removeHtmlTags(
          item.description
        );


      /*
      날짜
      */

      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "news-meta";

      meta.textContent =
        formatDate(
          item.pubDate
        );


      /*
      AI
      */

      const aiButton =
        document.createElement(
          "button"
        );

      aiButton.className =
        "ai-button";

      aiButton.textContent =
        "👻 AI 분석";


      const aiResult =
        document.createElement(
          "div"
        );

      aiResult.className =
        "ai-result";


      if (cachedAnalysis) {

        displayAIAnalysis(
          aiResult,
          cachedAnalysis
        );

        aiButton.textContent =
          "👻 분석 완료";

        aiButton.disabled =
          true;

      }


      aiButton.addEventListener(
        "click",
        async function() {

          if (
            aiAnalysisCache[
              articleKey
            ]
          ) {

            displayAIAnalysis(
              aiResult,
              aiAnalysisCache[
                articleKey
              ]
            );

            aiButton.textContent =
              "👻 분석 완료";

            aiButton.disabled =
              true;

            return;

          }


          aiButton.disabled =
            true;

          aiButton.textContent =
            "👻 분석 중...";


          aiResult.className =
            "ai-result show";

          aiResult.textContent =
            "AI가 뉴스를 분석하고 있습니다...";


          try {

            const analysis =
              await requestAIAnalysis(
                item
              );


            aiAnalysisCache[
              articleKey
            ] =
              analysis;


            saveAIAnalysisCache();


            displayAIAnalysis(
              aiResult,
              analysis
            );


            aiButton.textContent =
              "👻 분석 완료";


            /*
            분석이 끝나면
            상단에도 신호등 + 별 표시
            */

            const analysisBadge =
              document.createElement(
                "span"
              );

            analysisBadge.className =
              "analysis-badge";


            const display =
              getImpactDisplay(
                analysis.impact
              );


            analysisBadge.textContent =
              display.icon +
              " " +
              getStars(
                analysis.importance
              );


            top.appendChild(
              analysisBadge
            );


          } catch (error) {

            console.error(error);

            aiResult.innerHTML =
              "";


            const errorText =
              document.createElement(
                "div"
              );

            errorText.className =
              "ai-error";

            errorText.textContent =
              "AI 분석에 실패했습니다. 다시 시도해 주세요.";


            aiResult.appendChild(
              errorText
            );


            aiButton.disabled =
              false;

            aiButton.textContent =
              "👻 다시 분석";

          }

        }
      );


      /*
      카드 완성
      */

      card.appendChild(top);

      card.appendChild(
        titleBox
      );

      card.appendChild(
        description
      );

      card.appendChild(meta);

      card.appendChild(
        aiButton
      );

      card.appendChild(
        aiResult
      );

      newsList.appendChild(
        card
      );

    }
  );

}


/*
==================================================
HTML 제거
==================================================
*/

function removeHtmlTags(
  text
) {

  const temp =
    document.createElement(
      "div"
    );

  temp.innerHTML =
    text || "";


  return (
    temp.textContent ||
    temp.innerText ||
    ""
  );

}


/*
==================================================
URL 검사
==================================================
*/

function safeUrl(
  url
) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ) {

      return url;

    }

  } catch (error) {}


  return "#";

}


/*
==================================================
날짜
==================================================
*/

function formatDate(
  dateString
) {

  if (!dateString) {

    return "날짜 정보 없음";

  }


  const date =
    new Date(
      dateString
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return dateString;

  }


  return date.toLocaleString(
    "ko-KR",
    {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}
