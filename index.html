<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Stock News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .stock {
      display: inline-block;
      background: #eee;
      padding: 8px 12px;
      margin-right: 8px;
      border-radius: 20px;
    }

    .news-title {
      font-size: 18px;
      font-weight: bold;
    }

    .news-info {
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <h1>📈 My Stock News</h1>

  <div class="card">
    <h2>관심 종목</h2>
    <span class="stock">삼성전자</span>
    <span class="stock">SK하이닉스</span>
    <span class="stock">현대차</span>
  </div>

  <h2>최신 뉴스</h2>

  <div class="card">
    <div class="news-title">
      삼성전자, 차세대 HBM 공급 확대
    </div>
    <div class="news-info">
      연합뉴스 · 20분 전
    </div>
  </div>

  <div class="card">
    <div class="news-title">
      SK하이닉스, AI 반도체 투자 확대
    </div>
    <div class="news-info">
      한국경제 · 1시간 전
    </div>
  </div>
</body>
</html>
