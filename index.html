<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Stock News</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 24px;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
  margin-bottom: 25px;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

.stocks {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.stock {
  display: flex;
  align-items: center;
  gap: 7px;
  background: #eef1f5;
  padding: 9px 12px;
  border-radius: 999px;
}

.stock.active {
  background: #222;
  color: white;
}

.stock-name {
  cursor: pointer;
  font-weight: 600;
}

.stock-button {
  border: none;
  background: transparent;
  color: inherit;
  cursor: pointer;
  padding: 0;
  font-size: 15px;
}

.add-stock {
  border: none;
  background: #2563eb;
  color: white;
  padding: 10px 15px;
  border-radius: 999px;
  cursor: pointer;
}

.all-stock {
  background: #222;
  color: white;
  padding: 9px 13px;
  border-radius: 999px;
  cursor: pointer;
}

.keyword-info {
  color: #777;
  font-size: 13px;
  margin-top: 15px;
  line-height: 1.5;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

.refresh-button {
  border: none;
  background: #222;
  color: white;
  padding: 9px 14px;
  border-radius: 9px;
  cursor: pointer;
}

.news-card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 13px;
}

.news-card.is-new {
  box-shadow:
    0 0 0 1px #ffd6d6,
    0 5px 18px rgba(0,0,0,0.04);
}

.news-top {
  display: flex;
  gap: 7px;
  margin-bottom: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.stock-badge,
.source-badge,
.keyword-badge,
.new-badge {
  padding: 4px 8px;
  border-radius: 7px;
  font-size: 12px;
}

.stock-badge {
  background: #e8efff;
  color: #2458b8;
  font-weight: bold;
}

.source-badge {
  background: #e9f8ee;
  color: #16843c;
  font-weight: bold;
}

.source-badge.global {
  background: #eef2ff;
  color: #4338ca;
}

.keyword-badge {
  background: #fff4df;
  color: #a15c00;
}

.new-badge {
  background: #e53935;
  color: white;
  font-weight: bold;
}

.news-title {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.4;
  margin-bottom: 8px;
}

.news-title a {
  color: #111;
  text-decoration: none;
}

.news-title a:hover {
  text-decoration: underline;
}

.news-description {
  color: #555;
  line-height: 1.5;
  margin-bottom: 10px;
}

.news-meta {
  font-size: 13px;
  color: #999;
}


/*
==========================================
AI 버튼
==========================================
*/

.ai-button {
  margin-top: 14px;
  border: none;
  background: #111827;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}

.ai-button:disabled {
  opacity: 0.6;
  cursor: default;
}


/*
==========================================
AI 카드
==========================================
*/

.ai-result {
  display: none;
  margin-top: 14px;
  padding: 18px;
  background: #f8f7ff;
  border: 1px solid #e5e1ff;
  border-radius: 14px;
}

.ai-result.show {
  display: block;
}

.ai-result-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 18px;
}

.ai-section {
  margin-top: 17px;
}

.ai-label {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
  color: #555;
}

.ai-summary {
  margin: 0;
  padding-left: 21px;
  line-height: 1.7;
}

.ai-summary li {
  margin-bottom: 5px;
}


/*
영향 + 중요도
*/

.ai-status-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

.ai-status-box {
  background: white;
  padding: 14px;
  border-radius: 11px;
  border: 1px solid #ececec;
}

.ai-status-value {
  font-size: 18px;
  font-weight: bold;
  margin-top: 7px;
}


/*
신호등
*/

.impact-positive {
  color: #16843c;
}

.impact-negative {
  color: #d92d20;
}

.impact-uncertain {
  color: #c58a00;
}

.impact-neutral {
  color: #667085;
}


/*
별
*/

.importance-stars {
  font-size: 20px;
  letter-spacing: 2px;
  white-space: nowrap;
}


/*
이유
*/

.ai-reason {
  line-height: 1.7;
  color: #444;
}

.ai-error {
  color: #b42318;
}


/*
==========================================
기타
==========================================
*/

.message {
  background: white;
  padding: 25px;
  border-radius: 14px;
  color: #666;
}


/*
키워드 모달
*/

.modal-background {
  display: none;
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
  z-index: 1000;
}

.modal-background.show {
  display: flex;
}

.modal {
  background: white;
  width: 100%;
  max-width: 500px;
  padding: 24px;
  border-radius: 18px;
  box-sizing: border-box;
}

.modal h2 {
  margin-top: 0;
}

.modal-description {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
}

.keyword-input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 10px;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.cancel-button,
.save-button {
  border: none;
  padding: 10px 16px;
  border-radius: 9px;
  cursor: pointer;
}

.cancel-button {
  background: #eee;
}

.save-button {
  background: #2563eb;
  color: white;
}


/*
아이패드 / 모바일
*/

@media (max-width: 600px) {

  .container {
    padding: 15px;
  }

  .ai-status-row {
    grid-template-columns: 1fr 1fr;
  }

  .importance-stars {
    font-size: 17px;
    letter-spacing: 0;
  }

}

</style>

</head>


<body>

<div class="container">

<h1>📈 My Stock News</h1>

<div class="subtitle">
내 관심 종목과 관련 키워드의 뉴스를 한 번에
</div>


<div class="section">

<h2>내 종목</h2>

<div
  class="stocks"
  id="stockList"
>

<div
  class="all-stock"
  id="allStockButton"
>
전체
</div>

<button
  class="add-stock"
  id="addStockButton"
>
+ 종목 추가
</button>

</div>

<div class="keyword-info">
⚙️ 종목별 관련 키워드 설정 ·
처음 보는 뉴스에는 NEW가 표시됩니다.
</div>

</div>


<div class="toolbar">

<h2 id="newsHeading">
내 종목 최신 뉴스
</h2>

<button
  class="refresh-button"
  id="refreshButton"
>
↻ 새로고침
</button>

</div>


<div id="newsList">

<div class="message">
뉴스를 불러오는 중...
</div>

</div>

</div>



<!-- 키워드 설정 -->

<div
  class="modal-background"
  id="keywordModal"
>

<div class="modal">

<h2 id="modalTitle">
관련 키워드 설정
</h2>

<div class="modal-description">
쉼표(,)로 구분해서 입력하세요.<br><br>
예: HBM, NVIDIA, 파운드리
</div>

<input
  type="text"
  class="keyword-input"
  id="keywordInput"
  placeholder="예: HBM, NVIDIA"
>

<div class="modal-buttons">

<button
  class="cancel-button"
  id="cancelKeywordButton"
>
취소
</button>

<button
  class="save-button"
  id="saveKeywordButton"
>
저장
</button>

</div>

</div>

</div>



<script>

/*
==========================================
화면 요소
==========================================
*/

const addButton =
  document.getElementById("addStockButton");

const stockList =
  document.getElementById("stockList");

const newsList =
  document.getElementById("newsList");

const newsHeading =
  document.getElementById("newsHeading");

const refreshButton =
  document.getElementById("refreshButton");

const allStockButton =
  document.getElementById("allStockButton");

const keywordModal =
  document.getElementById("keywordModal");

const keywordInput =
  document.getElementById("keywordInput");

const modalTitle =
  document.getElementById("modalTitle");

const cancelKeywordButton =
  document.getElementById("cancelKeywordButton");

const saveKeywordButton =
  document.getElementById("saveKeywordButton");


/*
==========================================
저장 데이터
==========================================
*/

let stocks =
  JSON.parse(
    localStorage.getItem("stocks")
  ) || [
    "삼성전자",
    "SK하이닉스",
    "Curiox"
  ];


let stockKeywords =
  JSON.parse(
    localStorage.getItem("stockKeywords")
  ) || {};


let seenArticles =
  JSON.parse(
    localStorage.getItem("seenArticles")
  ) || [];


/*
AI 분석 캐시

기사 고유값을 이용해서
한 번 분석한 결과를 저장한다.
*/

let aiAnalysisCache =
  JSON.parse(
    localStorage.getItem(
      "aiAnalysisCache"
    )
  ) || {};


let selectedStock = "ALL";

let editingStock = null;


/*
==========================================
저장
==========================================
*/

function saveStocks() {

  localStorage.setItem(
    "stocks",
    JSON.stringify(stocks)
  );

}


function saveKeywords() {

  localStorage.setItem(
    "stockKeywords",
    JSON.stringify(stockKeywords)
  );

}


function saveSeenArticles() {

  if (seenArticles.length > 1000) {
    seenArticles =
      seenArticles.slice(-1000);
  }

  localStorage.setItem(
    "seenArticles",
    JSON.stringify(seenArticles)
  );

}


function saveAIAnalysisCache() {

  /*
  최대 200개 분석만 보관
  */

  const keys =
    Object.keys(
      aiAnalysisCache
    );


  if (keys.length > 200) {

    const keysToDelete =
      keys.slice(
        0,
        keys.length - 200
      );


    keysToDelete.forEach(
      function(key) {

        delete aiAnalysisCache[key];

      }
    );

  }


  localStorage.setItem(
    "aiAnalysisCache",
    JSON.stringify(
      aiAnalysisCache
    )
  );

}


/*
==========================================
종목
==========================================
*/

function renderStocks() {

  document
    .querySelectorAll(".stock")
    .forEach(function(element) {
      element.remove();
    });


  stocks.forEach(
    function(stockName, index) {

      const stock =
        document.createElement("div");

      stock.className = "stock";


      if (
        selectedStock === stockName
      ) {
        stock.classList.add(
          "active"
        );
      }


      const name =
        document.createElement("span");

      name.className =
        "stock-name";

      name.textContent =
        stockName;


      name.addEventListener(
        "click",
        function() {

          selectedStock =
            stockName;

          renderStocks();

          loadSingleStock(
            stockName
          );

        }
      );


      const settingsButton =
        document.createElement(
          "button"
        );

      settingsButton.className =
        "stock-button";

      settingsButton.textContent =
        "⚙️";

      settingsButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          openKeywordModal(
            stockName
          );

        }
      );


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "stock-button";

      deleteButton.textContent =
        "×";


      deleteButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          stocks.splice(
            index,
            1
          );

          delete stockKeywords[
            stockName
          ];

          saveStocks();

          saveKeywords();


          if (
            selectedStock ===
            stockName
          ) {
            selectedStock =
              "ALL";
          }

          renderStocks();

          loadAllNews();

        }
      );


      stock.appendChild(name);

      stock.appendChild(
        settingsButton
      );

      stock.appendChild(
        deleteButton
      );

      stockList.insertBefore(
        stock,
        addButton
      );

    }
  );

}


/*
==========================================
종목 추가
==========================================
*/

addButton.addEventListener(
  "click",
  function() {

    const stockName =
      prompt(
        "추가할 종목 이름을 입력하세요."
      );

    if (!stockName) {
      return;
    }

    const cleanName =
      stockName.trim();

    if (!cleanName) {
      return;
    }

    if (
      stocks.includes(cleanName)
    ) {

      alert(
        "이미 등록된 종목입니다."
      );

      return;
    }


    stocks.push(cleanName);

    saveStocks();

    renderStocks();

    loadAllNews();

  }
);


/*
==========================================
키워드
==========================================
*/

function openKeywordModal(
  stockName
) {

  editingStock =
    stockName;

  modalTitle.textContent =
    stockName +
    " 관련 키워드";

  const keywords =
    stockKeywords[
      stockName
    ] || [];

  keywordInput.value =
    keywords.join(", ");

  keywordModal.classList.add(
    "show"
  );

  keywordInput.focus();

}


cancelKeywordButton.addEventListener(
  "click",
  closeKeywordModal
);


saveKeywordButton.addEventListener(
  "click",
  function() {

    if (!editingStock) {
      return;
    }

    const keywords =
      keywordInput.value
        .split(",")
        .map(function(keyword) {
          return keyword.trim();
        })
        .filter(function(keyword) {
          return keyword.length > 0;
        });


    stockKeywords[
      editingStock
    ] =
      [...new Set(keywords)];


    const stockBeingEdited =
      editingStock;


    saveKeywords();

    closeKeywordModal();


    if (
      selectedStock ===
      stockBeingEdited
    ) {

      loadSingleStock(
        stockBeingEdited
      );

    } else {

      loadAllNews();

    }

  }
);


function closeKeywordModal() {

  keywordModal.classList.remove(
    "show"
  );

  editingStock = null;

}


keywordModal.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      keywordModal
    ) {

      closeKeywordModal();

    }

  }
);


/*
==========================================
전체 / 새로고침
==========================================
*/

allStockButton.addEventListener(
  "click",
  function() {

    selectedStock = "ALL";

    renderStocks();

    loadAllNews();

  }
);


refreshButton.addEventListener(
  "click",
  function() {

    if (
      selectedStock === "ALL"
    ) {

      loadAllNews();

    } else {

      loadSingleStock(
        selectedStock
      );

    }

  }
);


/*
==========================================
뉴스 API
==========================================
*/

async function fetchQuery(
  query,
  stockName,
  matchedKeyword
) {

  const response =
    await fetch(
      "/api/news?q=" +
      encodeURIComponent(query)
    );


  if (!response.ok) {
    throw new Error(
      "뉴스 호출 실패"
    );
  }


  const data =
    await response.json();


  return (
    data.items || []
  ).map(function(item) {

    return {
      ...item,
      stock: stockName,
      matchedKeyword:
        matchedKeyword
    };

  });

}


async function fetchStockNews(
  stockName
) {

  const keywords =
    (
      stockKeywords[
        stockName
      ] || []
    ).slice(0, 2);


  const requests = [

    fetchQuery(
      stockName,
      stockName,
      null
    )

  ];


  keywords.forEach(
    function(keyword) {

      requests.push(

        fetchQuery(
          keyword,
          stockName,
          keyword
        )

      );

    }
  );


  const results =
    await Promise.all(
      requests
    );


  return removeDuplicates(
    results.flat()
  );

}


/*
==========================================
전체 뉴스
==========================================
*/

async function loadAllNews() {

  selectedStock = "ALL";

  renderStocks();

  newsHeading.textContent =
    "내 종목 최신 뉴스";

  newsList.innerHTML =
    '<div class="message">뉴스를 모으는 중...</div>';


  if (stocks.length === 0) {

    newsList.innerHTML =
      '<div class="message">등록된 종목이 없습니다.</div>';

    return;
  }


  try {

    const results =
      await Promise.all(

        stocks.map(
          function(stock) {
            return fetchStockNews(
              stock
            );
          }
        )

      );


    let allNews =
      removeDuplicates(
        results.flat()
      );


    allNews.sort(
      sortByDate
    );


    renderNews(
      allNews
    );


  } catch (error) {

    console.error(error);

    newsList.innerHTML =
      '<div class="message">뉴스를 불러오는 중 오류가 발생했습니다.</div>';

  }

}


/*
==========================================
종목 하나
==========================================
*/

async function loadSingleStock(
  stockName
) {

  newsHeading.textContent =
    stockName +
    " 최신 뉴스";

  newsList.innerHTML =
    '<div class="message">뉴스를 불러오는 중...</div>';


  try {

    const items =
      await fetchStockNews(
        stockName
      );

    items.sort(
      sortByDate
    );

    renderNews(
      items
    );


  } catch (error) {

    console.error(error);

    newsList.innerHTML =
      '<div class="message">뉴스를 불러오지 못했습니다.</div>';

  }

}


/*
==========================================
날짜
==========================================
*/

function sortByDate(a, b) {

  return (
    new Date(
      b.pubDate
    ).getTime() || 0
  ) -
  (
    new Date(
      a.pubDate
    ).getTime() || 0
  );

}


/*
==========================================
기사 고유값
==========================================
*/

function getArticleKey(item) {

  if (item.link) {
    return item.link;
  }

  return (
    "title:" +
    removeHtmlTags(
      item.title
    )
      .toLowerCase()
      .trim()
  );

}


/*
==========================================
NEW
==========================================
*/

function isArticleSeen(key) {

  return seenArticles.includes(
    key
  );

}


function markArticleAsSeen(key) {

  if (
    !seenArticles.includes(key)
  ) {

    seenArticles.push(key);

    saveSeenArticles();

  }

}


/*
==========================================
중복 제거
==========================================
*/

function removeDuplicates(items) {

  const seen =
    new Set();

  return items.filter(
    function(item) {

      const key =
        getArticleKey(item);

      if (seen.has(key)) {
        return false;
      }

      seen.add(key);

      return true;

    }
  );

}


/*
==========================================
AI 요청
==========================================
*/

async function requestAIAnalysis(
  item
) {

  const response =
    await fetch(
      "/api/analyze",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            stock:
              item.stock,

            title:
              removeHtmlTags(
                item.title
              ),

            description:
              removeHtmlTags(
                item.description
              )

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error ||
      "AI 분석 실패"
    );

  }


  if (
    !data.analysis
  ) {

    throw new Error(
      "AI 분석 결과 없음"
    );

  }


  return data.analysis;

}


/*
==========================================
영향 표시
==========================================
*/

function getImpactDisplay(
  impact
) {

  if (impact === "긍정") {

    return {
      icon: "🟢",
      className:
        "impact-positive"
    };

  }


  if (impact === "부정") {

    return {
      icon: "🔴",
      className:
        "impact-negative"
    };

  }


  if (impact === "불확실") {

    return {
      icon: "🟡",
      className:
        "impact-uncertain"
    };

  }


  return {
    icon: "⚪",
    className:
      "impact-neutral"
  };

}


/*
==========================================
중요도 별
==========================================
*/

function getStars(
  importance
) {

  let number =
    Number(importance);


  if (
    !Number.isInteger(number) ||
    number < 1 ||
    number > 5
  ) {

    number = 1;

  }


  return (
    "★".repeat(number) +
    "☆".repeat(5 - number)
  );

}


/*
==========================================
AI 카드 표시
==========================================
*/

    title
  );

  */

    document.createElement(
      "div"
    );

  summarySection.className =
    "ai-section";

    document.createElement(
      "div"
    );

  summaryLabel.className =
    "ai-label";

  summaryLabel.textContent =
    "📝 3줄 요약";


  const summaryList =
    document.createElement(
      "ul"
    );

  summaryList.className =
    "ai-summary";

    );

    "ai-status-box";


  const impactLabel =
    document.createElement(
      "div"
    );

  impactLabel.className =
    "ai-label";

  impactLabel.textContent =
    "📊 종목 영향";

      "div"
    );

    );

    impactDisplay.className;

/*
==========================================
뉴스 표시
==========================================
*/

function renderNews(items) {

  newsList.innerHTML = "";


  if (items.length === 0) {

    newsList.innerHTML =
      '<div class="message">뉴스가 없습니다.</div>';

    return;
  }


  items.forEach(
    function(item) {

      const articleKey =
        getArticleKey(item);


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "news-card";


      const isNew =
        !isArticleSeen(
          articleKey
        );


      if (isNew) {
        card.classList.add(
          "is-new"
        );
      }


      /*
      배지
      */

      const top =
        document.createElement(
          "div"
        );

      top.className =
        "news-top";


      let newBadge = null;


      if (isNew) {

        newBadge =
          document.createElement(
            "span"
          );

        newBadge.className =
          "new-badge";

        newBadge.textContent =
          "NEW";

        top.appendChild(
          newBadge
        );

      }


      const stockBadge =
        document.createElement(
          "span"
        );

      stockBadge.className =
        "stock-badge";

      stockBadge.textContent =
        item.stock;

      top.appendChild(
        stockBadge
      );


      const sourceBadge =
        document.createElement(
          "span"
        );


      if (
        item.source === "GLOBAL"
      ) {

        sourceBadge.className =
          "source-badge global";

        sourceBadge.textContent =
          item.sourceName
            ? "GLOBAL · " +
              item.sourceName
            : "GLOBAL";

      } else {

        sourceBadge.className =
          "source-badge";

        sourceBadge.textContent =
          "NAVER";

      }


      top.appendChild(
        sourceBadge
      );


      if (
        item.matchedKeyword
      ) {

        const keywordBadge =
          document.createElement(
            "span"
          );

        keywordBadge.className =
          "keyword-badge";

        keywordBadge.textContent =
          item.matchedKeyword;

        top.appendChild(
          keywordBadge
        );

      }


      /*
      제목
      */

      const titleBox =
        document.createElement(
          "div"
        );

      titleBox.className =
        "news-title";


      const link =
        document.createElement(
          "a"
        );

      link.textContent =
        removeHtmlTags(
          item.title
        );

      link.href =
        safeUrl(
          item.link
        );

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";


      link.addEventListener(
        "click",
        function() {

          markArticleAsSeen(
            articleKey
          );

          if (newBadge) {
            newBadge.remove();
          }

          card.classList.remove(
            "is-new"
          );

        }
      );


      titleBox.appendChild(
        link
      );


      /*
      설명
      */

      const description =
        document.createElement(
          "div"
        );

      description.className =
        "news-description";

      description.textContent =
        removeHtmlTags(
          item.description
        );


      /*
      날짜
      */

      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "news-meta";

      meta.textContent =
        formatDate(
          item.pubDate
        );


      /*
      AI
      */

      const aiButton =
        document.createElement(
          "button"
        );

      aiButton.className =
        "ai-button";

      aiButton.textContent =
        "👻 AI 분석";


      const aiResult =
        document.createElement(
          "div"
        );

      aiResult.className =
        "ai-result";


      /*
      이미 분석한 기사라면
      저장된 결과 즉시 표시
      */

      if (
        aiAnalysisCache[
          articleKey
        ]
      ) {

        displayAIAnalysis(
          aiResult,
          aiAnalysisCache[
            articleKey
          ]
        );

        aiButton.textContent =
          "👻 분석 완료";

        aiButton.disabled =
          true;

      }


      /*
      새 AI 분석
      */

      aiButton.addEventListener(
        "click",
        async function() {

          /*
          혹시 캐시가 있으면
          API를 부르지 않는다.
          */

          if (
            aiAnalysisCache[
              articleKey
            ]
          ) {

            displayAIAnalysis(
              aiResult,
              aiAnalysisCache[
                articleKey
              ]
            );

            aiButton.textContent =
              "👻 분석 완료";

            aiButton.disabled =
              true;

            return;

          }


          aiButton.disabled =
            true;

          aiButton.textContent =
            "👻 분석 중...";

          aiResult.className =
            "ai-result show";

          aiResult.textContent =
            "AI가 뉴스를 분석하고 있습니다...";


          try {

            const analysis =
              await requestAIAnalysis(
                item
              );


            /*
            분석 저장
            */

            aiAnalysisCache[
              articleKey
            ] =
              analysis;


            saveAIAnalysisCache();


            /*
            화면 표시
            */

            displayAIAnalysis(
              aiResult,
              analysis
            );


            aiButton.textContent =
              "👻 분석 완료";


          } catch (error) {

            console.error(error);

            aiResult.innerHTML = "";


            const errorText =
              document.createElement(
                "div"
              );

            errorText.className =
              "ai-error";

            errorText.textContent =
              "AI 분석에 실패했습니다. 다시 시도해 주세요.";


            aiResult.appendChild(
              errorText
            );


            aiButton.disabled =
              false;

            aiButton.textContent =
              "👻 다시 분석";

          }

        }
      );


      /*
      카드 완성
      */

      card.appendChild(top);

      card.appendChild(
        titleBox
      );

      card.appendChild(
        description
      );

      card.appendChild(meta);

      card.appendChild(
        aiButton
      );

      card.appendChild(
        aiResult
      );

      newsList.appendChild(
        card
      );

    }
  );

}


/*
==========================================
HTML 제거
==========================================
*/

function removeHtmlTags(text) {

  const temp =
    document.createElement(
      "div"
    );

  temp.innerHTML =
    text || "";

  return (
    temp.textContent ||
    temp.innerText ||
    ""
  );

}


/*
==========================================
URL 검사
==========================================
*/

function safeUrl(url) {

  try {

    const parsed =
      new URL(url);

    if (
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ) {

      return url;

    }

  } catch (error) {}

  return "#";

}


/*
==========================================
날짜 표시
==========================================
*/

function formatDate(
  dateString
) {

  if (!dateString) {
    return "날짜 정보 없음";
  }


  const date =
    new Date(
      dateString
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return dateString;

  }


  return date.toLocaleString(
    "ko-KR",
    {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}
