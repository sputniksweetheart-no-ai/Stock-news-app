<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock News</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .stocks {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stock {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #eef1f5;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .stock:hover {
      background: #dfe5ec;
    }

    .stock.active {
      background: #222;
      color: white;
    }

    .delete-stock {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      color: inherit;
    }

    .add-stock {
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
    }

    .news-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .news-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .news-title a {
      color: #111;
      text-decoration: none;
    }

    .news-title a:hover {
      text-decoration: underline;
    }

    .news-description {
      color: #555;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .news-meta {
      color: #888;
      font-size: 13px;
    }

    .loading,
    .message {
      background: white;
      border-radius: 14px;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>📈 Stock News</h1>
    <div class="subtitle">
      관심 종목의 최신 뉴스를 확인하세요.
    </div>

    <div class="section">
      <h2>내 종목</h2>

      <div class="stocks" id="stockList">
        <button class="add-stock" id="addStockButton">
          + 종목 추가
        </button>
      </div>
    </div>

    <h2 id="newsHeading">최신 뉴스</h2>

    <div id="newsList">
      <div class="message">
        종목을 눌러 뉴스를 불러오세요.
      </div>
    </div>

  </div>

  <script>
    const addButton = document.getElementById("addStockButton");
    const stockList = document.getElementById("stockList");
    const newsList = document.getElementById("newsList");
    const newsHeading = document.getElementById("newsHeading");

    let stocks =
      JSON.parse(localStorage.getItem("stocks")) || [
        "삼성전자",
        "SK하이닉스",
        "현대차"
      ];

    let selectedStock = null;

    function saveStocks() {
      localStorage.setItem("stocks", JSON.stringify(stocks));
    }

    function renderStocks() {
      const existingStocks = document.querySelectorAll(".stock");
      existingStocks.forEach(function(stock) {
        stock.remove();
      });

      stocks.forEach(function(stockName, index) {
        const stock = document.createElement("div");
        stock.className = "stock";

        if (selectedStock === stockName) {
          stock.classList.add("active");
        }

        const name = document.createElement("span");
        name.textContent = stockName;

        name.addEventListener("click", function() {
          selectedStock = stockName;
          renderStocks();
          loadNews(stockName);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-stock";
        deleteButton.textContent = "×";

        deleteButton.addEventListener("click", function(event) {
          event.stopPropagation();

          stocks.splice(index, 1);
          saveStocks();

          if (selectedStock === stockName) {
            selectedStock = null;
            newsHeading.textContent = "최신 뉴스";
            newsList.innerHTML =
              '<div class="message">종목을 눌러 뉴스를 불러오세요.</div>';
          }

          renderStocks();
        });

        stock.appendChild(name);
        stock.appendChild(deleteButton);

        stockList.insertBefore(stock, addButton);
      });
    }

    addButton.addEventListener("click", function() {
      const stockName = prompt("추가할 종목 이름을 입력하세요.");

      if (!stockName) return;

      stocks.push(stockName.trim());
      saveStocks();
      renderStocks();
    });

    async function loadNews(stockName) {
      newsHeading.textContent = stockName + " 최신 뉴스";

      newsList.innerHTML =
        '<div class="loading">뉴스를 불러오는 중...</div>';

      try {
        const response = await fetch(
          "/api/news?q=" + encodeURIComponent(stockName)
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error("뉴스 API 호출 실패");
        }

        renderNews(data.items || []);

      } catch (error) {
        newsList.innerHTML =
          '<div class="message">뉴스를 불러오지 못했습니다.</div>';

        console.error(error);
      }
    }

    function renderNews(items) {
      newsList.innerHTML = "";

      if (items.length === 0) {
        newsList.innerHTML =
          '<div class="message">검색된 뉴스가 없습니다.</div>';
        return;
      }

      items.forEach(function(item) {
        const card = document.createElement("div");
        card.className = "news-card";

        const title = removeHtmlTags(item.title);
        const description = removeHtmlTags(item.description);

        card.innerHTML = `
          <div class="news-title">
            <a
              href="${item.originallink || item.link}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${title}
            </a>
          </div>

          <div class="news-description">
            ${description}
          </div>

          <div class="news-meta">
            ${formatDate(item.pubDate)}
          </div>
        `;

        newsList.appendChild(card);
      });
    }

    function removeHtmlTags(text) {
      const temp = document.createElement("div");
      temp.innerHTML = text || "";
      return temp.textContent || temp.innerText || "";
    }

    function formatDate(dateString) {
      const date = new Date(dateString);

      return date.toLocaleString("ko-KR", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    renderStocks();
  </script>
</body>
</html>
