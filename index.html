<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stock News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: #f6f7f9;
      color: #16181d;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .header {
      margin-bottom: 32px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .stocks {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stock {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .delete-stock {
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }

    .add-stock {
      background: #16181d;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .news-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid #eaecf0;
    }

    .news-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .news-title {
      font-size: 17px;
      line-height: 1.5;
      font-weight: 700;
    }

    .new-badge {
      background: #ffe5e5;
      color: #d92d20;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .news-meta {
      margin-top: 10px;
      color: #8a9099;
      font-size: 13px;
    }

    .tags {
      margin-top: 14px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tag {
      background: #f2f4f7;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 12px;
      color: #555d68;
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <div class="logo">Stock News</div>
      <div class="subtitle">
        내가 투자하는 종목의 중요한 뉴스를 한곳에서 확인하세요.
      </div>
    </header>


    <section class="section">

      <div class="section-title">
        내 종목
      </div>

      <div class="stocks" id="stockList">

        <button class="add-stock" id="addStockButton">
          + 종목 추가
        </button>

      </div>

    </section>


    <section class="section">

      <div class="section-title">
        최신 뉴스
      </div>

      <div class="news-card">
        <div class="news-top">

          <div class="news-title">
            삼성전자, 차세대 HBM 공급 확대 논의
          </div>

          <div class="new-badge">
            NEW
          </div>

        </div>

        <div class="news-meta">
          연합뉴스 · 20분 전
        </div>

        <div class="tags">
          <span class="tag">삼성전자</span>
          <span class="tag">HBM</span>
          <span class="tag">AI 반도체</span>
        </div>
      </div>

    </section>

  </div>


  <script>

    const addButton =
      document.getElementById("addStockButton");

    const stockList =
      document.getElementById("stockList");


    let stocks =
      JSON.parse(localStorage.getItem("stocks")) || [
        "삼성전자",
        "SK하이닉스",
        "현대차"
      ];


    function saveStocks() {

      localStorage.setItem(
        "stocks",
        JSON.stringify(stocks)
      );

    }


    function renderStocks() {

      const existingStocks =
        document.querySelectorAll(".stock");

      existingStocks.forEach(function(stock) {
        stock.remove();
      });


      stocks.forEach(function(stockName, index) {

        const stock =
          document.createElement("div");

        stock.className = "stock";


        const name =
          document.createElement("span");

        name.textContent = stockName;


        const deleteButton =
          document.createElement("button");

        deleteButton.className = "delete-stock";
        deleteButton.textContent = "×";


        deleteButton.addEventListener(
          "click",
          function() {

            stocks.splice(index, 1);

            saveStocks();

            renderStocks();

          }
        );


        stock.appendChild(name);

        stock.appendChild(deleteButton);

        stockList.insertBefore(
          stock,
          addButton
        );

      });

    }


    addButton.addEventListener(
      "click",
      function() {

        const stockName =
          prompt("추가할 종목 이름을 입력하세요.");

        if (!stockName) {
          return;
        }


        stocks.push(stockName);

        saveStocks();

        renderStocks();

      }
    );


    renderStocks();

  </script>

</body>
</html>
