<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Stock News</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .stocks {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stock {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #eef1f5;
      padding: 9px 12px;
      border-radius: 999px;
    }

    .stock.active {
      background: #222;
      color: white;
    }

    .stock-name {
      cursor: pointer;
      font-weight: 600;
    }

    .stock-button {
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-size: 15px;
    }

    .add-stock {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border-radius: 999px;
      cursor: pointer;
    }

    .all-stock {
      background: #222;
      color: white;
      padding: 9px 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .keyword-info {
      color: #777;
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .refresh-button {
      border: none;
      background: #222;
      color: white;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .news-card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 13px;
    }

    .news-card.is-new {
      box-shadow:
        0 0 0 1px #ffd6d6,
        0 5px 18px rgba(0, 0, 0, 0.04);
    }

    .news-top {
      display: flex;
      gap: 7px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stock-badge {
      background: #e8efff;
      color: #2458b8;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
    }

    .source-badge {
      background: #e9f8ee;
      color: #16843c;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
    }

    .source-badge.global {
      background: #eef2ff;
      color: #4338ca;
    }

    .keyword-badge {
      background: #fff4df;
      color: #a15c00;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
    }

    .new-badge {
      background: #e53935;
      color: white;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: bold;
    }

    .news-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .news-title a {
      color: #111;
      text-decoration: none;
    }

    .news-title a:hover {
      text-decoration: underline;
    }

    .news-description {
      color: #555;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .news-meta {
      font-size: 13px;
      color: #999;
    }


    /*
      AI 분석 버튼
    */

    .ai-button {
      margin-top: 14px;
      border: none;
      background: #111827;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .ai-button:hover {
      opacity: 0.9;
    }

    .ai-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /*
      AI 분석 결과 박스
    */

    .ai-result {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: #f8f7ff;
      border: 1px solid #e5e1ff;
      border-radius: 12px;
      line-height: 1.6;
    }

    .ai-result.show {
      display: block;
    }

    .ai-result-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .ai-section {
      margin-top: 12px;
    }

    .ai-label {
      font-weight: bold;
      margin-bottom: 3px;
    }

    .importance {
      font-size: 17px;
      letter-spacing: 1px;
    }


    /*
      메시지
    */

    .message {
      background: white;
      padding: 25px;
      border-radius: 14px;
      color: #666;
    }


    /*
      키워드 설정창
    */

    .modal-background {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .modal-background.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      border-radius: 18px;
      box-sizing: border-box;
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal-description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .keyword-input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-button {
      border: none;
      background: #eee;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
    }

    .save-button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    📈 My Stock News
  </h1>

  <div class="subtitle">
    내 관심 종목과 관련 키워드의 뉴스를 한 번에
  </div>


  <div class="section">

    <h2>
      내 종목
    </h2>

    <div
      class="stocks"
      id="stockList"
    >

      <div
        class="all-stock"
        id="allStockButton"
      >
        전체
      </div>

      <button
        class="add-stock"
        id="addStockButton"
      >
        + 종목 추가
      </button>

    </div>

    <div class="keyword-info">
      ⚙️ 종목별 관련 키워드 설정 ·
      처음 보는 뉴스에는 NEW가 표시됩니다.
    </div>

  </div>


  <div class="toolbar">

    <h2 id="newsHeading">
      내 종목 최신 뉴스
    </h2>

    <button
      class="refresh-button"
      id="refreshButton"
    >
      ↻ 새로고침
    </button>

  </div>


  <div id="newsList">

    <div class="message">
      뉴스를 불러오는 중...
    </div>

  </div>

</div>



<!-- 키워드 설정창 -->

<div
  class="modal-background"
  id="keywordModal"
>

  <div class="modal">

    <h2 id="modalTitle">
      관련 키워드 설정
    </h2>

    <div class="modal-description">
      쉼표(,)로 구분해서 입력하세요.<br><br>

      예:<br>
      HBM, NVIDIA, 파운드리
    </div>

    <input
      type="text"
      class="keyword-input"
      id="keywordInput"
      placeholder="예: HBM, NVIDIA"
    >

    <div class="modal-buttons">

      <button
        class="cancel-button"
        id="cancelKeywordButton"
      >
        취소
      </button>

      <button
        class="save-button"
        id="saveKeywordButton"
      >
        저장
      </button>

    </div>

  </div>

</div>



<script>

/*
==================================================
화면 요소
==================================================
*/

const addButton =
  document.getElementById("addStockButton");

const stockList =
  document.getElementById("stockList");

const newsList =
  document.getElementById("newsList");

const newsHeading =
  document.getElementById("newsHeading");

const refreshButton =
  document.getElementById("refreshButton");

const allStockButton =
  document.getElementById("allStockButton");

const keywordModal =
  document.getElementById("keywordModal");

const keywordInput =
  document.getElementById("keywordInput");

const modalTitle =
  document.getElementById("modalTitle");

const cancelKeywordButton =
  document.getElementById("cancelKeywordButton");

const saveKeywordButton =
  document.getElementById("saveKeywordButton");



/*
==================================================
저장된 종목
==================================================
*/

let stocks =
  JSON.parse(
    localStorage.getItem("stocks")
  ) || [
    "삼성전자",
    "SK하이닉스",
    "Curiox"
  ];



/*
==================================================
종목별 키워드
==================================================
*/

let stockKeywords =
  JSON.parse(
    localStorage.getItem("stockKeywords")
  ) || {};



/*
==================================================
읽은 뉴스 기록
==================================================
*/

let seenArticles =
  JSON.parse(
    localStorage.getItem("seenArticles")
  ) || [];



let selectedStock =
  "ALL";

let editingStock =
  null;



function saveStocks() {

  localStorage.setItem(
    "stocks",
    JSON.stringify(stocks)
  );

}



function saveKeywords() {

  localStorage.setItem(
    "stockKeywords",
    JSON.stringify(stockKeywords)
  );

}



function saveSeenArticles() {

  if (
    seenArticles.length > 1000
  ) {

    seenArticles =
      seenArticles.slice(-1000);

  }


  localStorage.setItem(
    "seenArticles",
    JSON.stringify(seenArticles)
  );

}



/*
==================================================
종목 표시
==================================================
*/

function renderStocks() {

  document
    .querySelectorAll(".stock")
    .forEach(
      function(element) {

        element.remove();

      }
    );


  stocks.forEach(
    function(stockName, index) {

      const stock =
        document.createElement("div");

      stock.className =
        "stock";


      if (
        selectedStock === stockName
      ) {

        stock.classList.add(
          "active"
        );

      }


      const name =
        document.createElement("span");

      name.className =
        "stock-name";

      name.textContent =
        stockName;


      name.addEventListener(
        "click",
        function() {

          selectedStock =
            stockName;

          renderStocks();

          loadSingleStock(
            stockName
          );

        }
      );



      const settingsButton =
        document.createElement("button");

      settingsButton.className =
        "stock-button";

      settingsButton.textContent =
        "⚙️";

      settingsButton.title =
        "관련 키워드 설정";


      settingsButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          openKeywordModal(
            stockName
          );

        }
      );



      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "stock-button";

      deleteButton.textContent =
        "×";


      deleteButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();


          stocks.splice(
            index,
            1
          );


          delete stockKeywords[
            stockName
          ];


          saveStocks();

          saveKeywords();


          if (
            selectedStock === stockName
          ) {

            selectedStock =
              "ALL";

          }


          renderStocks();

          loadAllNews();

        }
      );


      stock.appendChild(
        name
      );

      stock.appendChild(
        settingsButton
      );

      stock.appendChild(
        deleteButton
      );


      stockList.insertBefore(
        stock,
        addButton
      );

    }
  );

}



/*
==================================================
종목 추가
==================================================
*/

addButton.addEventListener(
  "click",
  function() {

    const stockName =
      prompt(
        "추가할 종목 이름을 입력하세요."
      );


    if (!stockName) {
      return;
    }


    const cleanName =
      stockName.trim();


    if (!cleanName) {
      return;
    }


    if (
      stocks.includes(cleanName)
    ) {

      alert(
        "이미 등록된 종목입니다."
      );

      return;

    }


    stocks.push(
      cleanName
    );


    saveStocks();

    renderStocks();

    loadAllNews();

  }
);



/*
==================================================
키워드 설정
==================================================
*/

function openKeywordModal(
  stockName
) {

  editingStock =
    stockName;


  modalTitle.textContent =
    stockName +
    " 관련 키워드";


  const keywords =
    stockKeywords[
      stockName
    ] || [];


  keywordInput.value =
    keywords.join(", ");


  keywordModal.classList.add(
    "show"
  );


  keywordInput.focus();

}



cancelKeywordButton.addEventListener(
  "click",
  function() {

    closeKeywordModal();

  }
);



saveKeywordButton.addEventListener(
  "click",
  function() {

    if (!editingStock) {
      return;
    }


    const keywords =
      keywordInput.value
        .split(",")
        .map(
          function(keyword) {

            return keyword.trim();

          }
        )
        .filter(
          function(keyword) {

            return keyword.length > 0;

          }
        );


    const uniqueKeywords =
      [...new Set(keywords)];


    stockKeywords[
      editingStock
    ] =
      uniqueKeywords;


    saveKeywords();


    const stockBeingEdited =
      editingStock;


    closeKeywordModal();


    if (
      selectedStock ===
      stockBeingEdited
    ) {

      loadSingleStock(
        stockBeingEdited
      );

    } else {

      loadAllNews();

    }

  }
);



function closeKeywordModal() {

  keywordModal
    .classList
    .remove("show");

  editingStock =
    null;

}



keywordModal.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      keywordModal
    ) {

      closeKeywordModal();

    }

  }
);



/*
==================================================
전체 / 새로고침
==================================================
*/

allStockButton.addEventListener(
  "click",
  function() {

    selectedStock =
      "ALL";

    renderStocks();

    loadAllNews();

  }
);



refreshButton.addEventListener(
  "click",
  function() {

    if (
      selectedStock === "ALL"
    ) {

      loadAllNews();

    } else {

      loadSingleStock(
        selectedStock
      );

    }

  }
);



/*
==================================================
뉴스 API
==================================================
*/

async function fetchQuery(
  query,
  stockName,
  matchedKeyword
) {

  const response =
    await fetch(
      "/api/news?q=" +
      encodeURIComponent(query)
    );


  if (!response.ok) {

    throw new Error(
      query +
      " 뉴스 호출 실패"
    );

  }


  const data =
    await response.json();


  return (
    data.items || []
  ).map(
    function(item) {

      return {

        ...item,

        stock:
          stockName,

        matchedKeyword:
          matchedKeyword

      };

    }
  );

}



async function fetchStockNews(
  stockName
) {

  const keywords =
    (
      stockKeywords[
        stockName
      ] || []
    ).slice(
      0,
      2
    );


  const requests =
    [];


  requests.push(

    fetchQuery(
      stockName,
      stockName,
      null
    )

  );


  keywords.forEach(
    function(keyword) {

      requests.push(

        fetchQuery(
          keyword,
          stockName,
          keyword
        )

      );

    }
  );


  const results =
    await Promise.all(
      requests
    );


  return removeDuplicates(
    results.flat()
  );

}



/*
==================================================
전체 뉴스
==================================================
*/

async function loadAllNews() {

  selectedStock =
    "ALL";


  renderStocks();


  newsHeading.textContent =
    "내 종목 최신 뉴스";


  newsList.innerHTML =
    '<div class="message">뉴스를 모으는 중...</div>';


  if (
    stocks.length === 0
  ) {

    newsList.innerHTML =
      '<div class="message">등록된 종목이 없습니다.</div>';

    return;

  }


  try {

    const requests =
      stocks.map(
        function(stock) {

          return fetchStockNews(
            stock
          );

        }
      );


    const results =
      await Promise.all(
        requests
      );


    let allNews =
      results.flat();


    allNews =
      removeDuplicates(
        allNews
      );


    allNews.sort(
      sortByDate
    );


    renderNews(
      allNews
    );


  } catch (error) {

    console.error(
      error
    );


    newsList.innerHTML =
      '<div class="message">뉴스를 불러오는 중 오류가 발생했습니다.</div>';

  }

}



/*
==================================================
종목 하나
==================================================
*/

async function loadSingleStock(
  stockName
) {

  newsHeading.textContent =
    stockName +
    " 최신 뉴스";


  newsList.innerHTML =
    '<div class="message">뉴스를 불러오는 중...</div>';


  try {

    const items =
      await fetchStockNews(
        stockName
      );


    items.sort(
      sortByDate
    );


    renderNews(
      items
    );


  } catch (error) {

    console.error(
      error
    );


    newsList.innerHTML =
      '<div class="message">뉴스를 불러오지 못했습니다.</div>';

  }

}



/*
==================================================
날짜 정렬
==================================================
*/

function sortByDate(
  a,
  b
) {

  const dateA =
    new Date(
      a.pubDate
    ).getTime();

  const dateB =
    new Date(
      b.pubDate
    ).getTime();


  return (
    (dateB || 0) -
    (dateA || 0)
  );

}



/*
==================================================
기사 고유값
==================================================
*/

function getArticleKey(
  item
) {

  if (item.link) {

    return item.link;

  }


  return (
    "title:" +
    removeHtmlTags(
      item.title
    )
      .toLowerCase()
      .trim()
  );

}



function isArticleSeen(
  articleKey
) {

  return seenArticles.includes(
    articleKey
  );

}



function markArticleAsSeen(
  articleKey
) {

  if (
    !seenArticles.includes(
      articleKey
    )
  ) {

    seenArticles.push(
      articleKey
    );


    saveSeenArticles();

  }

}



/*
==================================================
중복 제거
==================================================
*/

function removeDuplicates(
  items
) {

  const seen =
    new Set();


  return items.filter(
    function(item) {

      const key =
        getArticleKey(item);


      if (
        seen.has(key)
      ) {

        return false;

      }


      seen.add(key);

      return true;

    }
  );

}



/*
==================================================
뉴스 출력
==================================================
*/

function renderNews(
  items
) {

  newsList.innerHTML =
    "";


  if (
    items.length === 0
  ) {

    newsList.innerHTML =
      '<div class="message">뉴스가 없습니다.</div>';

    return;

  }


  items.forEach(
    function(item) {

      const articleKey =
        getArticleKey(item);


      const isNew =
        !isArticleSeen(
          articleKey
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "news-card";


      if (isNew) {

        card.classList.add(
          "is-new"
        );

      }



      /*
        배지 영역
      */

      const top =
        document.createElement(
          "div"
        );


      top.className =
        "news-top";


      let newBadge =
        null;


      if (isNew) {

        newBadge =
          document.createElement(
            "span"
          );


        newBadge.className =
          "new-badge";


        newBadge.textContent =
          "NEW";


        top.appendChild(
          newBadge
        );

      }



      const stockBadge =
        document.createElement(
          "span"
        );


      stockBadge.className =
        "stock-badge";


      stockBadge.textContent =
        item.stock;


      top.appendChild(
        stockBadge
      );



      const sourceBadge =
        document.createElement(
          "span"
        );


      if (
        item.source === "GLOBAL"
      ) {

        sourceBadge.className =
          "source-badge global";


        sourceBadge.textContent =
          item.sourceName
            ?
            "GLOBAL · " +
            item.sourceName
            :
            "GLOBAL";

      } else {

        sourceBadge.className =
          "source-badge";


        sourceBadge.textContent =
          "NAVER";

      }


      top.appendChild(
        sourceBadge
      );



      if (
        item.matchedKeyword
      ) {

        const keywordBadge =
          document.createElement(
            "span"
          );


        keywordBadge.className =
          "keyword-badge";


        keywordBadge.textContent =
          item.matchedKeyword;


        top.appendChild(
          keywordBadge
        );

      }



      /*
        기사 제목
      */

      const titleBox =
        document.createElement(
          "div"
        );


      titleBox.className =
        "news-title";


      const link =
        document.createElement(
          "a"
        );


      link.textContent =
        removeHtmlTags(
          item.title
        );


      link.href =
        safeUrl(
          item.link
        );


      link.target =
        "_blank";


      link.rel =
        "noopener noreferrer";


      link.addEventListener(
        "click",
        function() {

          markArticleAsSeen(
            articleKey
          );


          if (newBadge) {

            newBadge.remove();

          }


          card.classList.remove(
            "is-new"
          );

        }
      );


      titleBox.appendChild(
        link
      );



      /*
        설명
      */

      const description =
        document.createElement(
          "div"
        );


      description.className =
        "news-description";


      description.textContent =
        removeHtmlTags(
          item.description
        );



      /*
        날짜
      */

      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "news-meta";


      meta.textContent =
        formatDate(
          item.pubDate
        );



      /*
      ==================================================
      AI 분석 버튼
      ==================================================
      */

      const aiButton =
        document.createElement(
          "button"
        );


      aiButton.className =
        "ai-button";


      aiButton.textContent =
        "✨ AI 분석";



      /*
        AI 결과가 들어갈 공간
      */

      const aiResult =
        document.createElement(
          "div"
        );


      aiResult.className =
        "ai-result";



      /*
        버튼 클릭
      */

      aiButton.addEventListener(
        "click",
        function() {

          /*
            아직 실제 AI는 연결하지 않았다.

            다음 단계에서 이 부분이
            /api/analyze 를 호출하게 된다.
          */


          aiButton.disabled =
            true;


          aiButton.textContent =
            "✨ 분석 중...";


          aiResult.classList.add(
            "show"
          );


          aiResult.innerHTML =
            "";


          const loading =
            document.createElement(
              "div"
            );


          loading.textContent =
            "AI가 기사를 분석하고 있습니다...";


          aiResult.appendChild(
            loading
          );



          /*
            실제 AI처럼 보이도록
            잠깐 기다린 뒤 테스트 결과 표시

            이것은 API 호출이 아니다.
          */

          setTimeout(
            function() {

              showDemoAnalysis(
                aiResult,
                item
              );


              aiButton.textContent =
                "✓ AI 분석 완료";

            },
            700
          );

        }
      );



      /*
        카드 완성
      */

      card.appendChild(
        top
      );

      card.appendChild(
        titleBox
      );

      card.appendChild(
        description
      );

      card.appendChild(
        meta
      );

      card.appendChild(
        aiButton
      );

      card.appendChild(
        aiResult
      );


      newsList.appendChild(
        card
      );

    }
  );

}

/*
==================================================
HTML 제거
==================================================
*/

function removeHtmlTags(
  text
) {

  const temp =
    document.createElement(
      "div"
    );


  temp.innerHTML =
    text || "";


  return (
    temp.textContent ||
    temp.innerText ||
    ""
  );

}



/*
==================================================
안전한 URL
==================================================
*/

function safeUrl(
  url
) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ) {

      return url;

    }

  } catch (error) {

  }


  return "#";

}



/*
==================================================
날짜
==================================================
*/

function formatDate(
  dateString
) {

  if (!dateString) {

    return "날짜 정보 없음";

  }


  const date =
    new Date(
      dateString
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return dateString;

  }


  return date.toLocaleString(
    "ko-KR",
    {

      month:
        "short",

      day:
        "numeric",

      hour:
        "2-digit",

      minute:
        "2-digit"

    }
  );

}
